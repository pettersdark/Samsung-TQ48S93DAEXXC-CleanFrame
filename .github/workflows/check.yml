name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEANFRAME_PUBLIC_FONTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run check:tools
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - name: Bedroom browser regression checks
        run: |
          mkdir -p .local/qa
          python3 scripts/preview.py --public-fonts > .local/preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4795/home/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/bedroom-tests/menu-review.cjs
          node scripts/bedroom-tests/hdmi-name-review.cjs
          node scripts/bedroom-tests/v12-focus-review.cjs
          node scripts/bedroom-tests/v13-review.cjs
          node scripts/bedroom-tests/live-card-review.cjs
          node scripts/bedroom-tests/live-channel-fullscreen.cjs
          node scripts/bedroom-tests/unlimited-carousel.cjs
          node scripts/bedroom-tests/series-gallery.cjs
      - run: npm run export:public
